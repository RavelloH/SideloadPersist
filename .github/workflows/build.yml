name: Build experimental dylib
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      matched_bundle_id:
        description: 'Optional: entitlement application-identifier suffix (for matched PickerProbe artifact)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile unsigned iOS arm64 dylib
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          make all
          file dist/SideloadPersist.dylib
          xcrun lipo -info dist/SideloadPersist.dylib
          xcrun otool -L dist/SideloadPersist.dylib
      - name: Run path-mapping smoke tests on macOS
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang -fobjc-arc -std=gnu11 -framework Foundation -Isrc tests/PathSmoke.m src/PDRedirect.m -o /tmp/pd-path-smoke
          /tmp/pd-path-smoke
      - name: Test relocation, ZIP traversal protection and staged cold-start restore
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang -fobjc-arc -std=gnu11 -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES \
            -framework Foundation -Isrc -Ivendor/miniz \
            tests/StorageSmoke.m src/PDStorage.m src/PDArchive.m \
            vendor/miniz/miniz.c vendor/miniz/miniz_tdef.c vendor/miniz/miniz_tinfl.c vendor/miniz/miniz_zip.c \
            -o /tmp/pd-storage-smoke
          TEST_HOME="$(mktemp -d)"
          HOME="$TEST_HOME" /tmp/pd-storage-smoke prepare
          HOME="$TEST_HOME" /tmp/pd-storage-smoke apply
      - name: Build independent unsigned PickerProbe IPA
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist/probe-stage/Payload/PickerProbe.app
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=15.0 -fobjc-arc -fmodules -O2 -Wall -Wextra \
            -Wno-unused-parameter -framework UIKit -framework Foundation \
            -framework UniformTypeIdentifiers -framework Security \
            examples/PickerProbe/main.m src/PDPickerHostFix.m \
            -o dist/probe-stage/Payload/PickerProbe.app/PickerProbe
          cp examples/PickerProbe/Info.plist dist/probe-stage/Payload/PickerProbe.app/Info.plist
          plutil -lint dist/probe-stage/Payload/PickerProbe.app/Info.plist
          (cd dist/probe-stage && ditto -c -k --keepParent Payload ../PickerProbe-unsigned.ipa)
          file dist/PickerProbe-unsigned.ipa
          unzip -l dist/PickerProbe-unsigned.ipa
      - name: Build unsigned StorageProbe IPA (Foundation/POSIX/SQLite/CoreData tests)
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist/storage-stage/Payload/StorageProbe.app
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=15.0 -fobjc-arc -fmodules -O2 -Wall -Wextra \
            -Wno-unused-parameter -framework UIKit -framework Foundation \
            -framework CoreData -lsqlite3 examples/StorageProbe/main.m \
            -o dist/storage-stage/Payload/StorageProbe.app/StorageProbe
          cp examples/StorageProbe/Info.plist dist/storage-stage/Payload/StorageProbe.app/Info.plist
          plutil -lint dist/storage-stage/Payload/StorageProbe.app/Info.plist
          (cd dist/storage-stage && ditto -c -k --keepParent Payload ../StorageProbe-unsigned.ipa)
          unzip -l dist/StorageProbe-unsigned.ipa
      - name: Prepare unsigned identity-matched PickerProbe IPA
        if: ${{ inputs.matched_bundle_id != '' }}
        env:
          MATCHED_BUNDLE_ID: ${{ inputs.matched_bundle_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_matched_ipa.py \
            dist/PickerProbe-unsigned.ipa \
            dist/PickerProbe-matched-unsigned.ipa \
            "$MATCHED_BUNDLE_ID"
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SideloadPersist-ios-arm64-unsigned
          path: dist/SideloadPersist.dylib
          if-no-files-found: error
          retention-days: 14
      - name: Upload independent test IPA
        uses: actions/upload-artifact@v4
        with:
          name: PickerProbe-unsigned-ipa
          path: dist/PickerProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload StorageProbe test IPA
        uses: actions/upload-artifact@v4
        with:
          name: StorageProbe-unsigned-ipa
          path: dist/StorageProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload matched identity test IPA
        if: ${{ inputs.matched_bundle_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PickerProbe-matched-unsigned-ipa
          path: dist/PickerProbe-matched-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
